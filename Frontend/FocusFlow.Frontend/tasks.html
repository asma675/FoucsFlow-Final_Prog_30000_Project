<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FocusFlow – Tasks</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">FOCUS<span>FLOW</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="tasks.html" class="nav-link active">Tasks</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="settings.html" class="nav-link">Settings</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <section class="card">
      <div class="card-header">
        <h1 class="card-title">Tasks</h1>
        <p class="card-subtitle">
          Capture what’s on your mind and mark it complete when you’re done.
        </p>
      </div>

      <form id="task-form" style="margin-bottom:1.1rem;">
        <input type="hidden" id="task-id" />
        <div class="grid-two">
          <div>
            <label class="form-label" for="task-title">Title</label>
            <input id="task-title" type="text" required />
          </div>
          <div>
            <label class="form-label" for="task-category">Category</label>
            <input id="task-category" type="text" />
          </div>
          <div>
            <label class="form-label" for="task-priority">Priority</label>
            <select id="task-priority">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="task-status">Status</label>
            <select id="task-status">
              <option selected>Pending</option>
              <option>InProgress</option>
              <option>Completed</option>
            </select>
          </div>
          <div>
            <label class="form-label" for="task-dueDate">Due date</label>
            <input id="task-dueDate" type="date" />
          </div>
          <div>
            <label class="form-label" for="task-estimated">Est. minutes</label>
            <input id="task-estimated" type="number" min="0" />
          </div>
        </div>
        <div style="margin-top:0.8rem;">
          <button type="submit" class="btn">Save task</button>
        </div>
      </form>

      <table id="tasks-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Due</th>
            <th>Estimate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
</body>
</html>
