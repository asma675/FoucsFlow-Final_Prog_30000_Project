<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FocusFlow – Settings</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="index.html" class="brand">FOCUS<span>FLOW</span></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Login</a>
        <a href="register.html" class="nav-link">Register</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="tasks.html" class="nav-link">Tasks</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="settings.html" class="nav-link active">Settings</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <section class="card">
      <div class="card-header">
        <h1 class="card-title">Settings</h1>
        <p class="card-subtitle">
          Tune your Pomodoro durations and preferences. In guest mode, saving
          will call the API for user 1.
        </p>
      </div>

      <form id="settings-form">
        <div class="grid-two">
          <div>
            <label class="form-label" for="work-duration">Work duration (min)</label>
            <input id="work-duration" type="number" value="25" min="1" />
          </div>
          <div>
            <label class="form-label" for="break-duration">Break duration (min)</label>
            <input id="break-duration" type="number" value="5" min="1" />
          </div>
          <div>
            <label class="form-label" for="language">Language</label>
            <input id="language" type="text" value="en" />
          </div>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.6rem;">
            <input id="notifications-enabled" type="checkbox" checked />
            <label class="form-label" for="notifications-enabled">
              Enable notifications
            </label>
          </div>
        </div>

        <div style="margin-top:1rem;">
          <button type="submit" class="btn">Save settings</button>
        </div>
      </form>

      <div id="settings-message" class="message" style="margin-top:0.7rem;"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
