<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - FocusFlow</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <header>
        <h1>Welcome to Your Task Dashboard</h1>
        <p id="auth-status">Loading tasks...</p>
    </header>

    <main>
        <section class="task-form-section">
            <h2>Add New Task</h2>
            <form id="addTaskForm">
                <div>
                    <label for="taskTitle">Title:</label>
                    <input type="text" id="taskTitle" required maxlength="200">
                </div>
                <div>
                    <label for="taskPriority">Priority (1-5):</label>
                    <input type="number" id="taskPriority" min="1" max="5" value="3" required>
                </div>
                <div>
                    <label for="taskCategory">Category:</label>
                    <input type="text" id="taskCategory" required maxlength="50">
                </div>
                <div>
                    <label for="taskEstimatedTime">Estimated Time (HH:MM:SS):</label>
                    <input type="text" id="taskEstimatedTime" placeholder="e.g., 01:30:00">
                </div>
                <button type="submit">Create Task</button>
            </form>
            <p id="form-message"></p>
        </section>
        
        <section class="task-list-section">
            <h2>Your Pending Tasks</h2>
            <ul id="taskList">
                </ul>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
